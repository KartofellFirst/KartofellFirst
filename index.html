<!-- starter and starter-fallback -->
<div id="starter-fallback" style="position: fixed;top: 0;left: 0;width: 100vw;height: 100dvh;z-index: 99999;" onpointerenter="document.querySelector('#style').focus()"></div>
<div id="starter" tabindex="-1" autofocus onfocus="document.querySelector('#starter-fallback').remove();const script = document.querySelector('#script'); if (script.dataset.focused == 'false') { script.focus(); script.dataset.focused = 'true'; }; script.blur(); document.querySelector('#head-declarations').focus();"></div>

<!-- HEAD -->
<div onfocus="
document.title = 'Kartofells page'
document.querySelector('#style').focus(); // connecting styles inside of the <head> tag like in normal html
" id="head-declarations" tabindex="-1">
    <!-- STYLES -->
    <div onfocus="const sss = new CSSStyleSheet(); sss.replaceSync(`
        body, html { /* somehow blue horizontal line appears if i remove that */
            box-sizing: border-box;
            margin: 0; padding: 0;
            width: 0; height: 0;
        }

        .body {
            display: block; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: scroll; 
            margin: 0; padding: 0;
        }
        .wrapper {
            display: flex;
            width: 100%; height: 100%;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;

        }
    `); document.adoptedStyleSheets = [...document.adoptedStyleSheets, sss]" id="style" tabindex="-1">
    </div>
</div>
