<!-- starter and starter-fallback -->
<div id="starter-fallback" style="position: fixed;top: 0;left: 0;width: 100vw;height: 100dvh;z-index: 99999;" onpointerenter="document.querySelector('#style').focus()"></div>
<div id="starter" tabindex="-1" autofocus onfocus="document.querySelector('#starter-fallback').remove();const script = document.querySelector('#script'); window.addEventListener('DOMContentLoaded', function () { if (script.dataset.focused == 'false') { script.focus(); script.dataset.focused = 'true'; }; script.blur();}); document.querySelector('#head-declarations').focus();"></div>

<!-- HEAD -->
<div onfocus="
async function loadFonts() {
  try {
    const response = await fetch('https://fonts.googleapis.com/css2?family=Staatliches&display=swap');
    const fontCSS = await response.text();
    
    const sheet = new CSSStyleSheet();
    await sheet.replace(fontCSS);
    document.adoptedStyleSheets = [...document.adoptedStyleSheets, sheet];
  } catch (error) { console.error('Failed to load font:', error);}
}; 

loadFonts(); // load fonts without <link> or @import <- (because it doesnt work with JS)
document.title = 'Kartofells page' // set title without <title>
document.querySelector('#style').focus(); // connecting styles inside of the <head> tag like in normal html
" id="head-declarations" tabindex="-1">
    <!-- STYLES -->
    <div onfocus="const sss = new CSSStyleSheet(); sss.replaceSync(`
        body, html { /* somehow blue horizontal line appears if i remove that */
            box-sizing: border-box;
            margin: 0; padding: 0;
            width: 0; height: 0;
        }

        .body {
            display: block; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh; 
            margin: 0; padding: 0;
        }
        .wrapper {
            display: flex;
            width: 100%; height: 100%;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;

        }

        .line {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            padding: 5px;
            white-space: nowrap !important;
        }

        .column {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .column div {
            display: flex;
            flex-direction: row;
            white-space: pre;
        }

        .fade-in {
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .h1 {
            font-size: xxx-large;
            font-weight: bolder;
            font-family: 'Staatliches', sans-serif;
        }

        .i {
            font-style: italic;
        }
    `); document.adoptedStyleSheets = [...document.adoptedStyleSheets, sss]" id="style" tabindex="-1">
    </div>
</div>

if (!urlParams.has('alert')) {
